<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathFlow · 混合学术编辑器</title>
    <meta name="description" content="Markdown 为主、LaTeX 为辅的新一代混合学术编辑器" />
    <!--
      首帧就去决定深浅色：等 React 挂载再切会先闪一下白底。
      这里只读 localStorage 里的主题偏好，读不到就跟随系统。
    -->
    <style>
      html {
        background: #f3f5f8;
      }
      html.dark {
        background: #0f141b;
      }
    </style>
    <script>
      ;(function () {
        var dark = false
        try {
          var raw = localStorage.getItem('mf-settings-v1')
          var mode = raw ? JSON.parse(raw).theme || 'system' : 'system'
          dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
